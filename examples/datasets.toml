# datasets.toml — an example datamanifest (spec-v5, _META.schema = 1)
#
# A hand-authored manifest declaring a project's data dependencies: where each
# dataset comes from, how to verify it, and how each language loads it. It is the
# Project.toml / pyproject.toml analogue for data — committed, language-agnostic,
# and never machine-rewritten beyond auto-filled checksums. (Produced, cached
# datasets are NOT listed here; they are inventoried in the git-ignored state
# file .datamanifest/state.toml.)
#
# The datasets below the first divider are real, public, and fetch out of the box.
# The ones below the second divider are illustrative — they show the _LANG
# bindings, parameterized calls, and storage selectors, referencing example
# module:function names you would replace with your own.

[_META]
schema = 1
# A committed project name (the $project symbol; else the project-root basename)
# would go under [_STORAGE]: project = "myclimate"

# Project-wide default loaders, per language: format -> module:function. Used
# when a dataset does not declare its own loader for that language.
[_LANG.python.loaders]
csv = "pandas.io.parsers:read_csv"
nc  = "xarray:open_dataset"

[_LANG.julia.loaders]
csv = "CSV:read"
nc  = "NCDatasets:Dataset"

# ── Real, public datasets (fetch + verify + extract with no extra setup) ─────

# A single CSV behind a DOI. Loaded by the csv format default above.
[jonkers2024]
uri         = "https://download.pangaea.de/dataset/962852/files/LGM_foraminifera_assemblages_20240110.csv"
sha256      = "35ee6e8b94dc355973276da609fb18846ee1156d0fa848c1a9b221edd3715513"
doi         = "10.1594/PANGAEA.962852"
format      = "csv"
description = "LGM planktic-foraminifera assemblages (Jonkers et al., 2024)"

# A DOI archive: downloaded, checksum-verified, then unpacked (extract = true);
# the dataset path becomes the extracted directory.
[herzschuh2023]
uri         = "https://doi.pangaea.de/10.1594/PANGAEA.930512?format=zip"
sha256      = "4e40e43ac0f1ddea125cb5314eee46e332aacbcb18aff7efbf59f1d8b1d84a13"
doi         = "10.1594/PANGAEA.930512"
format      = "zip"
extract     = true
description = "Pollen-based climate reconstructions (Herzschuh et al., 2023)"

# A GitHub release tarball, addressed by a slash-quoted key.
["jesstierney/lgmDA"]
uri         = "https://github.com/jesstierney/lgmDA/archive/refs/tags/v2.1.zip"
sha256      = "da5f85235baf7f858f1b52ed73405f5d4ed28a8f6da92e16070f86b724d8bb25"
extract     = true
description = "Tierney et al. LGM data-assimilation product (v2.1)"

# ── Illustrative datasets (replace the module:function refs with your own) ────

# Per-dataset loader override, BARE-STRING form. A bare "module:function" is
# called the conventional way: the loader receives the dataset path and nothing
# else is injected. It overrides the nc format default for this dataset only.
[ocean_temp]
uri         = "https://example.com/argo_ocean_temp.nc"
sha256      = "c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4"
format      = "nc"
description = "Argo float ocean-temperature profiles"

[ocean_temp._LANG.python]
loader = "myclimate.loaders:load_argo"
[ocean_temp._LANG.julia]
loader = "MyClimate:load_argo"

# Per-dataset loader, TABLE form (parameterized). The table is explicit: the tool
# calls ref(*args; kwargs...) and injects nothing, so you pass $path yourself.
# Lets one function serve several datasets that differ only in arguments.
# Requires the `binding-args` capability.
[esm_5x5]
uri         = "https://example.com/esm_5x5.nc"
sha256      = "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2"
format      = "nc"
description = "Regridded ESM field at 5x5 resolution"

[esm_5x5._LANG.julia.loader]
ref    = "MyClimate:load_esm"
args   = ["$path"]
kwargs = { grid = "5x5", skip_models = ["CESM.*"] }

# A dataset with no public URI: produced by a fetcher. The own-language fetcher
# runs in-process; the bare `shell` fetcher is a language-agnostic fallback (the
# same command for every tool) that writes to $download_path.
[model_output]
sha256      = "e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6"
format      = "nc"
description = "Local climate-model run, built on demand"
shell       = "make model_output OUTPUT=$download_path"   # language-agnostic

[model_output._LANG.python]
fetcher = "myclimate.build:model_output"
loader  = "myclimate.loaders:load_output"

# Single-language shorthand: a BARE binding (no _LANG.<lang> wrapper) is read as the
# running tool's OWN language — handy for a Python-only or Julia-only project. An
# explicit [..._LANG.<self>] binding overrides it; a bare binding that fails to resolve
# in the running language is an error (use [_LANG.<lang>] for multi-language manifests).
[sea_ice]
uri         = "https://example.com/sea_ice.nc"
sha256      = "b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3"
format      = "nc"
loader      = "myclimate.loaders:load_sea_ice"   # language-implicit (own language)
description = "Sea-ice concentration"

# Per-dataset location: a big, re-fetchable input parked on the OS-reclaimable
# cache folder instead of the default datasets folder ($key keeps it tool-managed).
[reanalysis]
uri         = "https://example.com/era5_slice.nc"
sha256      = "f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1"
format      = "nc"
storage_path  = "$user_cache_dir/$key"
description = "ERA5 reanalysis slice"
