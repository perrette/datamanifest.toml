site_name: datamanifest.toml
site_description: A TOML manifest format for declaring a project's data dependencies — read by tools in different languages
site_url: https://perrette.github.io/datamanifest.toml/
repo_url: https://github.com/perrette/datamanifest.toml
repo_name: perrette/datamanifest.toml
edit_uri: edit/main/

# Narrative content lives as Markdown in docs/ and in the repo-root spec files
# (README.md, SCHEMA.md, ROADMAP.md, CHANGELOG.md, and the per-directory READMEs).
# Nothing is duplicated: the homepage and the reference pages pull those files in
# via the include-markdown plugin (single source of truth).
docs_dir: docs

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

plugins:
  - search
  - include-markdown

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting started:
      - Quickstart: quickstart.md
  - Guide:
      - The manifest in one minute: guide/manifest.md
      - Declaring datasets: guide/datasets.md
      - Language bindings: guide/bindings.md
      - Resolution (fetch & load ladders): guide/resolution.md
      - Storage: guide/storage.md
      - Produced datasets and caching: guide/caching.md
      - Maintenance (inspect): guide/maintenance.md
      - Cross-machine sync: guide/sync.md
      - Conformance and versioning: guide/conformance.md
      - Migration and deprecations: guide/migration.md
  - Reference:
      - Schema specification: schema.md
      - JSON Schemas: schemas.md
      - Examples: examples.md
      - Conformance fixtures: fixtures.md
  - Development:
      - Roadmap: roadmap.md
      - Changelog: changelog.md
