<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="t">
  <title id="t">datamanifest — stacked drives (white, for dark backgrounds)</title>
  <defs>
    <mask id="ds-dark">
      <!-- visible ink -->
      <rect x="40" y="52"  width="176" height="46" rx="9" fill="#fff"/>
      <rect x="40" y="107" width="176" height="46" rx="9" fill="#fff"/>
      <rect x="40" y="162" width="176" height="46" rx="9" fill="#fff"/>
      <!-- knockouts: faceplate lines -->
      <rect x="56" y="70"  width="56" height="5" rx="2.5" fill="#000"/>
      <rect x="56" y="80"  width="40" height="5" rx="2.5" fill="#000"/>
      <rect x="56" y="125" width="56" height="5" rx="2.5" fill="#000"/>
      <rect x="56" y="135" width="40" height="5" rx="2.5" fill="#000"/>
      <rect x="56" y="180" width="56" height="5" rx="2.5" fill="#000"/>
      <rect x="56" y="190" width="40" height="5" rx="2.5" fill="#000"/>
    </mask>
  </defs>
  <rect x="0" y="0" width="256" height="256" fill="#ffffff" mask="url(#ds-dark)"/>
</svg>
