[_META]
schema = 1

[_STORAGE]
datasets_dir  = "$user_data_dir/proj"   # centralized fetched data under a chosen name
datacache_dir = "cached"                # produced cache, local (relative => <repo>/cached/)
scratch       = "$TMPDIR"               # user-defined reusable $-symbol

[_STORAGE._HOST."login*.hpc.edu"]       # host-specific resolution (hostname glob)
scratch       = "/scratch/$USER"        # the symbol, host-specific
datacache_dir = "$scratch/cache"        # a field, host-specific

# default location: $datasets_dir/$key (no override)
[plain]
uri    = "https://example.com/plain.nc"
format = "nc"

# keyed override: parked on scratch, still tool-managed ($key present)
[big]
uri        = "https://example.com/big.nc"
format     = "nc"
local_path = "$scratch/$key"

# exact path (no $key): user-managed, maintenance never touches it
[pinned]
format     = "nc"
local_path = "$scratch/exact/file.nc"
