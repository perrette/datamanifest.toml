[_META]
schema = 1

[_LANG.julia.loaders]
nc = "NCDatasets:Dataset"

[_LANG.python.loaders]
nc = "xarray:open_dataset"

# One loader function reused across two datasets that differ only in arguments.
[esm_5x5]
uri     = "https://example.com/esm_5x5.nc"
format  = "nc"
version = "v2"

[esm_5x5._LANG.julia.fetcher]
ref  = "MyPkg:build_esm"
args = { resolution = "high", tag = "$version" }

[esm_5x5._LANG.julia.loader]
ref  = "MyPkg:load_esm"
args = { grid = "5x5", skip_models = ["CESM.*", "FGOALS.*"] }

[esm_5x5._LANG.python.loader]
ref  = "mypkg.load:esm"
args = { grid = "5x5" }

[esm_10x10]
uri     = "https://example.com/esm_10x10.nc"
format  = "nc"
version = "v2"

[esm_10x10._LANG.julia.loader]
ref  = "MyPkg:load_esm"
args = { grid = "10x10" }
